# CloudNativePatroni container contract suite.
#
# This fork-owned gate builds the production image and runs its eight container
# contracts plus a self-test that defends the harness's own assertion
# enforcement.
#
# The host PID sweep needs --pid host. GitHub-hosted runners support it because
# they are plain virtual machines.
#
# run-contract-tests.sh defaults to linux/arm64, so CNPATRONI_PLATFORM must be
# set explicitly on this amd64 runner.
name: CNPatroni container contract tests

on:
  # A Patroni or Postgres regression can arrive without changing poc/image, and
  # any branch outside a branch-pattern filter would silently lose the gate.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-contracts:
    name: Run the container contract suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the production image and run the container contracts
        run: bash poc/image/test/run-contract-tests.sh
        env:
          CNPATRONI_PLATFORM: linux/amd64
