# The curated half of the CloudNativePatroni HA authority audit.
#
# The scanner finds code paths. This file records what we decided to do about
# each one, and the check cross-references the two in both directions: every hit
# must appear here, and every entry here must still name a symbol that exists.
# That second direction is what makes an upstream merge that renames or deletes a
# function visible rather than silent.
#
# class: keep | move | adapt | disable | delete-later      (specification 9.1)
# dest:  patroni-container | finite-init | cnpatroni-agent | operator | disabled
#
# Nothing in this file changes any CloudNativePG code. Milestone M0 records the
# decisions; the surgery lands in M1, after ADR-002 is accepted.

schema: cnpatroni-authority-classification/v1

defaults:
  owner: NikolayS

entries:

  # ---------------------------------------------------------------------------
  # api/v1
  # ---------------------------------------------------------------------------

  - path: api/v1/cluster_funcs.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/api/v1.(*Cluster).IsInstanceFenced
    class: delete-later
    dest: disabled
    rationale: >-
      Accessor for the fencing annotation. Harmless on its own, but it is the API
      surface every fencing caller reaches through, so it is removed once the
      callers are gone rather than before them, to keep upstream merges cheap.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  # ---------------------------------------------------------------------------
  # internal/cmd/manager/instance
  # ---------------------------------------------------------------------------

  - path: internal/cmd/manager/instance/pgbasebackup/cmd.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/pgbasebackup.(*CloneInfo).bootstrapUsingPgbasebackup
    class: disable
    dest: disabled
    rationale: >-
      Clones a replica with pg_basebackup and then writes its replication
      topology. Patroni creates replicas through create_replica and owns the
      recovery configuration that follows.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.9"

  - path: internal/cmd/manager/instance/run/cmd.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run.runSubCommand
    class: adapt
    dest: cnpatroni-agent
    rationale: >-
      Registers thirteen runnables into one controller-runtime manager, of which
      only four carry HA authority. The file is not deleted: the retained
      runnables become the agent, and the lifecycle, lease and reaper
      registrations are removed.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.2"

  - path: internal/cmd/manager/instance/run/lease/runnable.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lease.imports
    class: disable
    dest: disabled
    rationale: >-
      The package imports client-go leader election. A second leader-election
      client racing Patroni's DCS lock is the two-authority architecture the
      specification forbids, so the import itself is the marker.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4, 8.5"

  - path: internal/cmd/manager/instance/run/lease/runnable.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lease.(*Runnable).Acquire
    class: disable
    dest: disabled
    rationale: >-
      Blocks until the primary Lease is held, which is the gate CloudNativePG
      opens before promoting. Patroni's leader lock replaces it in full.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.5"
    guard: ""

  - path: internal/cmd/manager/instance/run/lease/runnable.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lease.(*Runnable).claim
    class: disable
    dest: disabled
    rationale: >-
      Writes the holder record into the Lease object. This is the exact operation
      Patroni performs against its own DCS, and doing both means two locks
      disagree.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.5"

  - path: internal/cmd/manager/instance/run/lease/runnable.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lease.(*Runnable).runLeaderElection
    class: disable
    dest: disabled
    rationale: >-
      On preemption it returns a fatal error that shuts the manager down and
      stops PostgreSQL. It is a process-stop authority hidden inside a
      leader-election loop.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4, 8.5"

  - path: internal/cmd/manager/instance/run/lifecycle/lifecycle.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lifecycle.(*PostgresLifecycle).Start
    class: disable
    dest: disabled
    rationale: >-
      The supervisor loop that restarts the postmaster forever and translates
      signals into shutdown modes. Under ADR-002 option A Patroni is the
      lifecycle root and this loop has no successor.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.1, 8.2"

  - path: internal/cmd/manager/instance/run/lifecycle/run.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lifecycle.(*PostgresLifecycle).runPostgresAndWait
    class: disable
    dest: disabled
    rationale: >-
      Execs the postmaster as a child of the instance manager and waits on it.
      This is the ownership inversion the fork exists to remove.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.1"

  - path: internal/cmd/manager/instance/run/lifecycle/reaper.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lifecycle.(*PostgresOrphansReaper).Start
    class: disable
    dest: disabled
    rationale: >-
      Reaps orphaned postgres children on SIGCHLD, which only makes sense while
      the instance manager is PID 1. Patroni or a transparent init reaps its own
      children.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.2"

  # ---------------------------------------------------------------------------
  # internal/cmd/plugin
  # ---------------------------------------------------------------------------

  - path: internal/cmd/plugin/fence/fence.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/plugin/fence.fencingOn
    class: disable
    dest: disabled
    rationale: >-
      A user-facing command that stops PostgreSQL by annotation, bypassing both
      the operator and Patroni. Specification section 12.3 does not carry fencing
      forward in this form.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: internal/cmd/plugin/fence/fence.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/plugin/fence.fencingOff
    class: disable
    dest: disabled
    rationale: >-
      The unfencing half of the same command. It is listed separately because
      leaving only the removal path live would let a cluster be unfenced by a
      mechanism that can no longer fence.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: internal/cmd/plugin/promote/promote.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/plugin/promote.Promote
    class: disable
    dest: disabled
    rationale: >-
      Patches Status.TargetPrimary directly from the kubectl plugin, so a human
      can drive CloudNativePG's promotion path straight past Patroni. It must
      become a Patroni switchover request or nothing.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.1"

  - path: internal/cmd/plugin/status/status.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/plugin/status.(*PostgresqlStatus).printBasicInfo
    class: adapt
    dest: operator
    rationale: >-
      Renders the fenced-instance set for display only. It stays, but must read
      whatever replaces the fencing annotation rather than the annotation itself.
    reviewed-at: "2026-08-10 01:30:00 UTC"

  # ---------------------------------------------------------------------------
  # internal/controller
  # ---------------------------------------------------------------------------

  - path: internal/controller/cluster_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcile
    class: adapt
    dest: operator
    rationale: >-
      The main reconcile loop stays, but the branch that detects a switchover or
      failover in progress and re-marks the old primary unhealthy is removed with
      the election engine it belongs to.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.3"

  - path: internal/controller/cluster_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).handleSwitchover
    class: disable
    dest: disabled
    rationale: >-
      The entry point from the main loop into the election engine. Disabling the
      engine while leaving its entry point live would produce a reconcile that
      silently does nothing on failover.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/controller/cluster_create.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).createPrimaryInstance
    class: adapt
    dest: operator
    rationale: >-
      Creating the first instance is retained work, but it currently sets
      TargetPrimary before creating the bootstrap Job. The Pod is still created;
      which instance becomes leader is decided by Patroni's bootstrap.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.9"

  - path: internal/controller/cluster_create.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).ensureInstanceBootstrapJob
    class: adapt
    dest: operator
    rationale: >-
      Refuses to create a Pod whose name differs from TargetPrimary, and
      defensively writes TargetPrimary so that the instance manager does not shut
      the primary down. Both guards disappear with the code they protect against.
    reviewed-at: "2026-08-10 01:30:00 UTC"

  - path: internal/controller/cluster_restore.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.ensureClusterIsNotFenced
    class: disable
    dest: disabled
    rationale: >-
      A restore precondition expressed in terms of the fencing annotation, which
      has no successor.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: internal/controller/cluster_restore.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.restoreClusterStatus
    class: disable
    dest: disabled
    rationale: >-
      Chooses the primary from a persistent-volume-claim serial number. A role
      decision taken from storage metadata is exactly the kind of authority that
      must not survive the fork.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/controller/cluster_status.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).setPrimaryInstance
    class: disable
    dest: disabled
    rationale: >-
      The single operator-side writer of Status.TargetPrimary, and the cleanest
      cut point in the repository. Under CloudNativePatroni the desired primary
      is never chosen by the operator.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4, 8.12"

  - path: internal/controller/cluster_status.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).updateResourceStatus
    class: adapt
    dest: operator
    rationale: >-
      Broad status refresh that is worth keeping, except for the branch that
      rolls TargetPrimary back to CurrentPrimary when the target Pod vanishes.
      That branch is a role decision and goes.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.12"

  - path: internal/controller/cluster_upgrade.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).rolloutRequiredInstances
    class: adapt
    dest: operator
    rationale: >-
      Rolling replicas first and deferring the primary is behaviour worth keeping;
      it must ask Patroni which instance is the leader instead of reading the
      cluster status.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.12"

  - path: internal/controller/cluster_upgrade.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).switchPrimary
    class: disable
    dest: disabled
    rationale: >-
      A second switchover engine, independent of the one in replicas.go, that
      writes TargetPrimary to roll the primary during an upgrade. Two switchover
      engines is one more than the architecture allows, and both are replaced.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/controller/cluster_upgrade.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).updatePrimaryPod
    class: disable
    dest: disabled
    rationale: >-
      Chooses between restarting in place, switching over, and deleting the
      primary Pod, and sets the phases the instance manager obeys. The choice
      becomes a Patroni switchover request.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.1"

  - path: internal/controller/primary_lease.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcilePrimaryLease
    class: disable
    dest: disabled
    rationale: >-
      Creates and adopts the coordination.k8s.io Lease that the instance manager
      then competes for. Specification section 9.2 lists this file, but note the
      renewal and preemption logic lives in the run/lease package instead.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.5"

  - path: internal/controller/replicas.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcileTargetPrimaryFromPods
    class: disable
    dest: disabled
    rationale: >-
      The top of the CloudNativePG election engine: it decides whether the
      situation is a switchover or a failover. Patroni's leader race replaces it.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/controller/replicas.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcileTargetPrimaryForNonReplicaCluster
    class: disable
    dest: disabled
    rationale: >-
      Picks the most advanced instance as the new primary and writes the pending
      failover marker. Candidate selection is Patroni's, gated by
      maximum_lag_on_failover and failover_priority.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/controller/replicas.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcileTargetPrimaryForReplicaCluster
    class: disable
    dest: disabled
    rationale: >-
      Designated-primary selection for replica clusters. Same authority as the
      non-replica path, reached through a different branch, so it needs its own
      cut.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/controller/replicas.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).setPrimaryOnSchedulableNode
    class: disable
    dest: disabled
    rationale: >-
      Elects a replacement primary while a Node is being drained. A drain is a
      reason to ask Patroni for a switchover, not a reason for the operator to
      pick a winner.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.1"

  - path: internal/controller/replicas.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).markOldPrimaryAsUnhealthy
    class: disable
    dest: disabled
    rationale: >-
      Patches the Pod role label to pull the old primary out of the read-write
      Service. It is a write-routing decision, and it collides directly with
      Patroni's own role label.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.1, 8.6"

  - path: internal/controller/replicas_quorum.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).evaluateQuorumCheck
    class: disable
    dest: disabled
    rationale: >-
      A second, independent safety authority that can permit or deny a failover.
      Patroni's synchronous mode carries the equivalent guarantee, and two safety
      authorities is the architecture the specification rules out.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "4.1"

  # ---------------------------------------------------------------------------
  # internal/management/controller
  # ---------------------------------------------------------------------------

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).Reconcile
    class: move
    dest: cnpatroni-agent
    rationale: >-
      The instance-manager main loop. Most of what it orchestrates is safe
      in-database reconciliation that the agent keeps; the role-transition,
      fencing and restart branches are removed from it.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.2"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).reconcilePrimary
    class: disable
    dest: disabled
    rationale: >-
      Acquires the primary Lease, promotes, and then announces itself as the
      current primary. It is the whole CloudNativePG promotion sequence in one
      function.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).handlePromotion
    class: disable
    dest: disabled
    rationale: >-
      Waits for the WAL receiver to stop and then runs pg_ctl promote. It is the
      only caller of the promotion primitive, which makes it the second cut point
      after the primitive itself.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).reconcileOldPrimary
    class: disable
    dest: disabled
    rationale: >-
      When the target primary is somebody else, it shuts PostgreSQL down
      immediately so the instance can be demoted. Patroni demotes a former
      primary through its own crash-recovery and rewind path.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4, 8.13"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).reconcileDesignatedPrimary
    class: disable
    dest: disabled
    rationale: >-
      Drives the replica-cluster designated-primary transition by rewriting the
      replication topology. Topology is Patroni's.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).reconcileClusterRoleWithoutDB
    class: disable
    dest: disabled
    rationale: >-
      Decides the instance's role before PostgreSQL is reachable, by inspecting
      the data directory. Deriving a role locally is precisely the race Patroni's
      DCS lock exists to prevent.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.12"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).reconcileFencing
    class: disable
    dest: disabled
    rationale: >-
      Reads the fencing annotation and stops or starts PostgreSQL accordingly. A
      stop authority that answers to an annotation rather than to the leader lock.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).restartPrimaryInplaceIfRequested
    class: disable
    dest: disabled
    rationale: >-
      Restarts PostgreSQL in place when the operator sets the in-place restart
      phase. A restart request must reach Patroni, which knows whether the
      instance currently holds the leader lock.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.1"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).triggerRestartForDecrease
    class: disable
    dest: disabled
    rationale: >-
      Restarts the primary when a hot-standby parameter is decreased. Patroni
      tracks pending_restart with per-major-version parameter validation and owns
      the decision.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.11"

  - path: internal/management/controller/instance_controller.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).refreshConfigurationFiles
    class: disable
    dest: disabled
    rationale: >-
      Writes the PostgreSQL configuration files inside the Pod. Patroni renders
      them from its own configuration, and two writers to one configuration file
      is a corruption source, not a race we can arbitrate.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.11"

  - path: internal/management/controller/instance_startup.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).verifyPgDataCoherenceForPrimary
    class: disable
    dest: disabled
    rationale: >-
      The former-primary recovery routine: it demotes, waits for a switchover,
      cleans a stale PID file, and runs pg_rewind. Specification section 9.2
      understates this file; it is the most dangerous single function in the
      inventory.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4, 8.13"

  - path: internal/management/controller/instance_sync.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).updateFailoverQuorumObject
    class: disable
    dest: disabled
    rationale: >-
      Publishes the synchronous-replication metadata that the operator's quorum
      check consumes. It exists only to feed a second safety authority.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "4.1"

  # ---------------------------------------------------------------------------
  # pkg/management/postgres: the process-control primitives
  # ---------------------------------------------------------------------------

  - path: pkg/management/postgres/promote.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).PromoteAndWait
    class: disable
    dest: disabled
    rationale: >-
      Runs pg_ctl promote, waits for standby.signal to disappear and issues a
      checkpoint. Specification section 7.4 bullet one names this operation
      directly.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Startup
    class: disable
    dest: disabled
    rationale: >-
      Starts PostgreSQL with pg_ctl and waits for it. Patroni starts PostgreSQL,
      including on the paths that only wanted a temporary local instance.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Shutdown
    class: disable
    dest: disabled
    rationale: >-
      Stops PostgreSQL with pg_ctl in smart, fast or immediate mode. Shutdown
      mode is part of the failover contract and belongs to whichever component
      holds the leader lock.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.4, 8.4"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Run
    class: disable
    dest: disabled
    rationale: >-
      Execs the postmaster directly as a child of the instance manager. This one
      line is the ownership inversion; everything else in this package follows
      from it.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "7.1"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Reload
    class: disable
    dest: disabled
    rationale: >-
      Reloads or restarts PostgreSQL for a configuration change. Patroni decides
      whether a parameter change needs a reload or a restart, and when a restart
      is safe.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.11"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).TryShuttingDownSmartFast
    class: disable
    dest: disabled
    rationale: >-
      Escalates a smart shutdown to a fast one after a timeout. The escalation
      policy is part of the shutdown sequence Patroni owns.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.4"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).TryShuttingDownFastImmediate
    class: disable
    dest: disabled
    rationale: >-
      Escalates a fast shutdown to an immediate one. Reaching immediate mode
      changes what recovery the next start has to perform, so it is not a local
      decision.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "8.4"

  - path: pkg/management/postgres/instance.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).RequestFastImmediateShutdown
    class: disable
    dest: disabled
    rationale: >-
