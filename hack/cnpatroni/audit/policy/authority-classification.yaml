    rationale: >-
      Removes an instance from the same annotation. Listed separately because a
      partial removal would leave clusters that can be unfenced but not fenced.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: pkg/utils/fencing.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/utils.GetFencedInstances
    class: adapt
    dest: operator
    rationale: >-
      Reads the fencing annotation. Reading is not authority, and the operator
      still needs to report a cluster left fenced by an older release, so this
      one survives the removal of the writers.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: pkg/utils/fencing.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/utils.NewFencingMetadataExecutor
    class: disable
    dest: disabled
    rationale: >-
      Builds the executor that applies a fencing change to a cluster or an
      instance. It is the constructor every fencing caller reaches for.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  # ---------------------------------------------------------------------------
  # tests module
  #
  # The end-to-end module is scanned as a first-class root rather than excluded.
  # Its helpers drive real clusters, so a helper that forces a primary would
  # quietly defeat the chaos suite that is supposed to prove Patroni is in charge.
  # ---------------------------------------------------------------------------

  - path: tests/internal/asserts/cluster/cluster.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/tests/internal/asserts/cluster.assertSwitchoverWithHistory
    class: disable
    dest: disabled
    rationale: >-
      An end-to-end helper that forces a switchover by writing the target primary
      directly. It has to become a Patroni switchover request, or the suite will
      keep passing while proving nothing.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "15"

  - path: tests/utils/fencing/fencing.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/tests/utils/fencing.On
    class: disable
    dest: disabled
    rationale: >-
      Test helper that fences an instance. It follows the production fencing
      machinery it exercises.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

  - path: tests/utils/fencing/fencing.go
    symbol: github.com/cloudnative-pg/cloudnative-pg/tests/utils/fencing.Off
    class: disable
    dest: disabled
    rationale: >-
      The unfencing test helper, retired with its counterpart so that no test can
      leave a cluster in a state the product can no longer reach.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    spec-ref: "12.3"

# -----------------------------------------------------------------------------
# The instance-manager responsibility map, which is specification section 9.1's
# second requirement. A responsibility is a statement about behaviour, so it
# cannot be generated; the anchors are what keep it honest, because the check
# reports a row as stale when an anchor stops existing.
# -----------------------------------------------------------------------------

responsibilities:

  - responsibility: Exec and supervise the postmaster
    dest: disabled
    rationale: >-
      Patroni execs postgres in the same container and cgroup, and the kubelet
      restarts the container when Patroni exits.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Run
      - github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lifecycle.(*PostgresLifecycle).Start

  - responsibility: Start, stop, restart and reload PostgreSQL with pg_ctl
    dest: disabled
    rationale: >-
      Every one of these is a lifecycle operation that the component holding the
      leader lock must take, which is Patroni.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Startup
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Shutdown
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Reload

  - responsibility: Promote a replica
    dest: disabled
    rationale: >-
      Promotion follows from winning the leader race, and the leader race is
      Patroni's.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).PromoteAndWait

  - responsibility: Reconcile a former primary with pg_rewind and pg_control handling
    dest: disabled
    rationale: >-
      Patroni's use_pg_rewind carries the checkpoint, timeline and precondition
      rules that a reimplementation has to rediscover one incident at a time.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Rewind
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).managePgControlFileBackup
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).CleanUpStalePid

  - responsibility: Write standby.signal and the replication topology
    dest: disabled
    rationale: >-
      Recovery configuration is Patroni's, and a second writer of these files
      produces divergence rather than a race that can be arbitrated.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.UpdateReplicaConfiguration
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.createStandbySignal
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).Demote

  - responsibility: Compute and write synchronous_standby_names
    dest: disabled
    rationale: >-
      Patroni's synchronous mode and quorum commit own this parameter, including
      the strict variant that refuses to fall back to asynchronous replication.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/postgres/replication.GetSynchronousStandbyNames
      - github.com/cloudnative-pg/cloudnative-pg/pkg/postgres.CreatePostgresqlConfiguration

  - responsibility: Acquire, renew and release the primary Lease
    dest: disabled
    rationale: >-
      The leader lock is Patroni's DCS lock. Holding a second lock in Kubernetes
      means two locks that can disagree about who is leader.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lease.(*Runnable).Acquire
      - github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcilePrimaryLease

  - responsibility: Select a promotion candidate and announce the new primary
    dest: disabled
    rationale: >-
      Candidate eligibility in Patroni is expressed through maximum_lag_on_failover,
      failover_priority and nofailover, and the winner is decided by the leader
      race rather than by a control-plane sort.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/postgres.(*PostgresqlStatusList).Less
      - github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).setPrimaryInstance
      - github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).reconcileTargetPrimaryFromPods

  - responsibility: Write the instance role label that the read-write Service selects on
    dest: disabled
    rationale: >-
      Patroni maintains its own role label. Two writers to the label that routes
      writes is the failure this fork exists to remove.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/utils.SetInstanceRole
      - github.com/cloudnative-pg/cloudnative-pg/pkg/reconciler/instance.updateRoleLabels

  - responsibility: Fence an instance through the fencing annotation
    dest: disabled
    rationale: >-
      A stop authority that answers to an annotation rather than to the leader
      lock. The legitimate uses, such as a cold volume snapshot, become Patroni
      requests instead.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/utils.AddFencedInstance
      - github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).reconcileFencing

  - responsibility: Fail liveness deliberately when the API server is unreachable
    dest: disabled
    rationale: >-
      This isolation self-fence is a second implementation of the fence that
      Patroni's leader-lock renewal and the kubelet provide together.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres/webserver/probes.(*livenessExecutor).IsHealthy

  - responsibility: Replace the instance-manager binary in place while PostgreSQL keeps running
    dest: disabled
    rationale: >-
      Incompatible with a container whose lifecycle root is Patroni, because
      there is no long-lived process here to replace.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/upgrade.reloadInstanceManager
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres/webserver.(*remoteWebserverEndpoints).updateInstanceManager

  - responsibility: Bootstrap a new cluster and clone replicas
    dest: disabled
    rationale: >-
      Patroni's bootstrap and create_replica sections perform this work, and two
      definitions of a freshly created cluster is one too many.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(InitInfo).Bootstrap
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(InitInfo).Join

  - responsibility: Reconcile declarative databases, publications, subscriptions and roles
    dest: cnpatroni-agent
    rationale: >-
      Safe in-database reconciliation with no process authority. It stays inside
      the Pod, but every primary check must ask Patroni rather than read the
      cluster status.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).Reconcile

  - responsibility: Rotate application and superuser credentials inside PostgreSQL
    dest: cnpatroni-agent
    rationale: >-
      Secret material is applied with ordinary SQL and does not touch the process
      or the role, so it moves unchanged apart from its primary check.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).refreshCredentialsFromSecret

  - responsibility: Serve the observation payload and the backup remote procedure calls
    dest: cnpatroni-agent
    rationale: >-
      Informational and backup endpoints carry no authority once the probes are
      repointed, but they must tolerate Patroni restarting PostgreSQL underneath
      them.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres.(*Instance).GetStatus

  - responsibility: Export metrics from PostgreSQL
    dest: cnpatroni-agent
    rationale: >-
      The exporter keeps working against a server it does not own; only the
      series derived from CloudNativePG's synchronous topology need rethinking.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/management/postgres/webserver/metricserver.newMetrics

  - responsibility: Relocate the write-ahead log directory and prepare tablespace mount points
    dest: finite-init
    rationale: >-
      Filesystem preparation that must run once before PostgreSQL starts and then
      exit. The one rule that matters is that it must not become a supervisor.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/internal/management/controller.(*InstanceReconciler).ReconcileTablespaces

  - responsibility: Create the streaming replication user and grant the rewind functions
    dest: finite-init
    rationale: >-
      Patroni needs a replication user and a rewind user with the same grants, so
      this work survives but has to run where Patroni can find its results.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/internal/cmd/manager/instance/run/lifecycle.configurePgRewindPrivileges

  - responsibility: Answer the startup, readiness and liveness probes
    dest: patroni-container
    rationale: >-
      The kubelet must observe the component that actually owns PostgreSQL, which
      means Patroni's REST endpoint rather than the instance manager's status
      port.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/specs.createPostgresContainers

  - responsibility: Write the cluster status, including the current primary and the phases
    dest: operator
    rationale: >-
      The status stays in the control plane but becomes a read-only mirror of
      what Patroni reports, never an instruction that a Pod-local component obeys.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/internal/controller.(*ClusterReconciler).updateResourceStatus

  - responsibility: Reconcile Pods, volumes, Services, role-based access control and disruption budgets
    dest: operator
    rationale: >-
      This is the CloudNativePG surface the fork exists to keep, and it is
      unchanged apart from the read-write Service selector.
    reviewed-at: "2026-08-10 01:30:00 UTC"
    anchors:
      - github.com/cloudnative-pg/cloudnative-pg/pkg/specs.CreateClusterReadWriteService

# -----------------------------------------------------------------------------
# Allowlist. There is no inline suppression comment anywhere in this design: an
# escape hatch written next to the code is invisible in review, so an exception
# has to be recorded here, with a reason and an owner.
#
# Note what is deliberately absent: the future Patroni integration packages are
# not blanket-allowed. Patroni the process performs the forbidden operations; our
# Go code does not, in any package.
# -----------------------------------------------------------------------------

allow:

  - rule: recovery.conninfo
    package: github.com/cloudnative-pg/cloudnative-pg/pkg/postgres
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/postgres.init
    reason: >-
      primary_conninfo and primary_slot_name appear here only as keys in the
      fixed-parameter denylist, which rejects them in user configuration. That is
      a prohibition, not a write, and specification section 8.11's reserved
      parameter list will be built from this same table.
    reviewed-at: "2026-08-10 01:30:00 UTC"

  - rule: sync.standby-names
    package: github.com/cloudnative-pg/cloudnative-pg/pkg/postgres
    symbol: github.com/cloudnative-pg/cloudnative-pg/pkg/postgres.init
    reason: >-
      synchronous_standby_names is in the same denylist for the same reason. The
      genuine writer in this package is the configuration renderer, which is
      classified rather than allowed.
    reviewed-at: "2026-08-10 01:30:00 UTC"

  - rule: imgr.online-upgrade
    package: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/plugin/psql
    symbol: github.com/cloudnative-pg/cloudnative-pg/internal/cmd/plugin/psql.execKubectl
    reason: >-
      The rule looks for a process replacing itself, and this one replaces the
      plugin with kubectl on the operator's workstation. It is not inside the
      database container and carries no PostgreSQL lifecycle authority.
    reviewed-at: "2026-08-10 01:30:00 UTC"
