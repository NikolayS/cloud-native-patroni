# This manifest is exact target state for later operator generation. It is a
# walking-skeleton stepping stone, not a substitute for the operator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpatroni-poc-config
  namespace: cnpatroni-poc
data:
  patroni.yml.in: |
    scope: cnpatroni-poc-rw

    restapi:
      listen: 0.0.0.0:8008
      authentication:
        username: "@@RESTAPI_USERNAME@@"
        password: "@@RESTAPI_PASSWORD@@"

    kubernetes:
      use_endpoints: true
      # This owner-fixed key stores the Patroni scope rather than the logical
      # cluster name. The naming ADR must resolve that semantic collision.
      scope_label: cnpatroni.io/cluster
      role_label: cnpatroni.io/role
      leader_label_value: primary
      follower_label_value: replica
      standby_leader_label_value: primary
      bypass_api_service: false
      labels:
        cnpatroni.io/podRole: instance
      ports:
        - name: postgresql
          port: 5432

    bootstrap:
      # Patroni writes this block to the DCS only during first bootstrap.
      # Later edits here do not change an existing cluster's live settings.
      dcs:
        # Fencing requires ttl >= loop_wait + retry_timeout
        #   + failureThreshold x periodSeconds + timeoutSeconds
        #   + probe terminationGracePeriodSeconds + safetyMargin.
        # Here: 45 >= 10 + 10 + 3 x 5 + 2 + 3 + 5.
        ttl: 45
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        check_timeline: true
        failsafe_mode: true
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_wal_senders: 10
            max_replication_slots: 10
            wal_log_hints: "on"
      initdb:
        - encoding: UTF8
        - locale: C.UTF-8
        - data-checksums
      post_bootstrap: /etc/cnpatroni/config/post-bootstrap.sh

    postgresql:
      data_dir: /var/lib/postgresql/data/pgdata
      pgpass: /run/cnpatroni/pgpass
      listen: 0.0.0.0:5432
      authentication:
        superuser:
          username: "@@SUPERUSER_USERNAME@@"
          password: "@@SUPERUSER_PASSWORD@@"
        replication:
          username: "@@REPLICATION_USERNAME@@"
          password: "@@REPLICATION_PASSWORD@@"
        rewind:
          username: "@@REWIND_USERNAME@@"
          password: "@@REWIND_PASSWORD@@"
      parameters:
        password_encryption: scram-sha-256
      pg_hba:
        - local all all peer
        - host all all 127.0.0.1/32 scram-sha-256
        - host all all 10.244.0.0/16 scram-sha-256
        - host replication cnpatroni_replication 10.244.0.0/16 scram-sha-256

    # kind has no hardware watchdog. Fencing therefore rests on the leader-key
    # TTL and failsafe mode, which limits what this walking skeleton proves.
    watchdog:
      mode: "off"

    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false

  entrypoint.sh: |
    #!/usr/bin/env bash
    ##
    ## Copyright © contributors to CloudNativePG, established as
    ## CloudNativePG a Series of LF Projects, LLC.
    ##
    ## Licensed under the Apache License, Version 2.0 (the "License");
    ## you may not use this file except in compliance with the License.
    ## You may obtain a copy of the License at
    ##
    ##     http://www.apache.org/licenses/LICENSE-2.0
    ##
    ## Unless required by applicable law or agreed to in writing, software
    ## distributed under the License is distributed on an "AS IS" BASIS,
    ## WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    ## See the License for the specific language governing permissions and
    ## limitations under the License.
    ##
    ## SPDX-License-Identifier: Apache-2.0
    ##

    set -Eeuo pipefail
    IFS=$'\n\t'

    umask 077
    python3 - \
      /etc/cnpatroni/config/patroni.yml.in \
      /run/cnpatroni/patroni.yml \
      /etc/cnpatroni/credentials <<'PYTHON'
    import os
    import pathlib
    import re
    import sys

    template_path = pathlib.Path(sys.argv[1])
    output_path = pathlib.Path(sys.argv[2])
    credential_directory = pathlib.Path(sys.argv[3])
    credential_files = {
        "@@RESTAPI_USERNAME@@": "restapi-username",
        "@@RESTAPI_PASSWORD@@": "restapi-password",
        "@@SUPERUSER_USERNAME@@": "superuser-username",
        "@@SUPERUSER_PASSWORD@@": "superuser-password",
        "@@REPLICATION_USERNAME@@": "replication-username",
        "@@REPLICATION_PASSWORD@@": "replication-password",
        "@@REWIND_USERNAME@@": "rewind-username",
        "@@REWIND_PASSWORD@@": "rewind-password",
    }

    rendered = template_path.read_text(encoding="utf-8")
    for placeholder, filename in credential_files.items():
        value = (credential_directory / filename).read_text(encoding="utf-8").rstrip("\n")
        if not value or "\n" in value or "\r" in value:
            raise ValueError(f"Credential file {filename} must contain one non-empty line")
        rendered = rendered.replace(placeholder, value)

    remaining = re.findall(r"@@[A-Z_]+@@", rendered)
    if remaining:
        raise ValueError(f"Unresolved configuration placeholders: {', '.join(remaining)}")

    descriptor = os.open(output_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
    with os.fdopen(descriptor, "w", encoding="utf-8") as output:
        output.write(rendered)
    PYTHON

    # The image's /usr/local/bin/cnpatroni-entrypoint is overridden; this is the
    # entrypoint the cluster actually runs. It replaces the shell so Patroni is
    # literal PID 1 and must never loop or restart Patroni.
    exec patroni /run/cnpatroni/patroni.yml

  post-bootstrap.sh: |
    #!/usr/bin/env bash
    ##
    ## Copyright © contributors to CloudNativePG, established as
    ## CloudNativePG a Series of LF Projects, LLC.
    ##
    ## Licensed under the Apache License, Version 2.0 (the "License");
    ## you may not use this file except in compliance with the License.
    ## You may obtain a copy of the License at
    ##
    ##     http://www.apache.org/licenses/LICENSE-2.0
    ##
    ## Unless required by applicable law or agreed to in writing, software
    ## distributed under the License is distributed on an "AS IS" BASIS,
    ## WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    ## See the License for the specific language governing permissions and
    ## limitations under the License.
    ##
    ## SPDX-License-Identifier: Apache-2.0
    ##

    set -Eeuo pipefail
    IFS=$'\n\t'

    umask 077
    if (($# != 1)); then
      printf 'Post-bootstrap requires Patroni to pass one libpq connection string.\n' >&2
      exit 1
    fi

    readonly APP_PASSWORD_FILE='/etc/cnpatroni/credentials/app-password'
    app_password="$(<"${APP_PASSWORD_FILE}")"
    if [[ ! "${app_password}" =~ ^[[:xdigit:]]{48}$ ]]; then
      printf 'The application password file does not contain the expected hex value.\n' >&2
      exit 1
    fi

    psql "$1" --set ON_ERROR_STOP=1 <<SQL
    DO \$role\$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app') THEN
        CREATE ROLE app LOGIN PASSWORD '${app_password}';
      ELSE
        ALTER ROLE app LOGIN PASSWORD '${app_password}';
      END IF;
    END
    \$role\$;
    SELECT 'CREATE DATABASE app OWNER app'
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'app') \gexec
    ALTER DATABASE app OWNER TO app;
    SQL
